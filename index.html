<!DOCTYPE html>
<html>
    <head>
        <title>홈 :: 시누의 장난감 상자</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
        <style>
            @media (prefers-color-scheme: dark) {
                :root {
                    --home-bg: #282836;
                    --home-fg: #e6e6e6;
                    --home-vig: #212127;
                    --home-text-shadow: #141414;
                    --home-item-border: #6060a0;
                }
            }
            @media (prefers-color-scheme: light) {
                :root {
                    --home-bg: #d0d0e6;
                    --home-fg: #141414;
                    --home-vig: #c6c6e1;
                    --home-text-shadow: #b0b0bf;
                    --home-item-border: #b0b0f0;
                }
            }
            body, html {
                background-color: var(--home-bg);
                color: var(--home-fg);
                margin: 0;
                padding: 0;
                height: 100%;
                font-family: 'NanumSquare', sans-serif;
                font-weight: 600;
                text-shadow: 2px 2px 2px var(--home-text-shadow);
                user-select: none;
            }
            .container {
                height: 100dvh;
                text-align: center;
                display: flex;
                flex-direction: column;
            }
            .topbar {
                flex-shrink: 0;
                padding: 16px;
                text-align: left;
                background: linear-gradient(180deg, var(--home-vig), transparent);
            }
            .topbar span {
                display: inline-block;
                transform-origin: 50% 100%;
                transform-style: preserve-3d;
                animation: speen 4s ease-in-out infinite;
            }
            .topbar span:nth-child(1)  { animation-delay: 0.0s; }
            .topbar span:nth-child(2)  { animation-delay: 0.125s; }
            .topbar span:nth-child(3)  { animation-delay: 0.25s; }
            .topbar span:nth-child(4)  { animation-delay: 0.375s; }
            .topbar span:nth-child(5)  { animation-delay: 0.5s; }
            .topbar span:nth-child(6)  { animation-delay: 0.625s; }
            .topbar span:nth-child(7)  { animation-delay: 0.75s; }
            .topbar span:nth-child(8) { animation-delay: 0.875s; }
            @keyframes speen {
                0% {
                    transform: rotateX(0deg);
                }
                15% {
                    transform: rotateX(40deg);
                }
                30% {
                    transform: rotateX(0deg);
                }
                100% {
                    transform: rotateX(0deg);
                }
            }
            .menu {
                flex-grow: 1;
                padding: 20px;
                display: flex;
                overflow-y: auto;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
            }
            .menu-item-container {
                flex-shrink: 0;
                margin: 16px;
                --tilt: 0deg;
                rotate: var(--tilt);
            }
            .menu-item-icon {
                width: 200px;
                height: 200px;
                border: 4px solid var(--home-item-border);
                box-shadow: 6px 6px 1px var(--home-text-shadow);
            }
            .menu-item-icon:hover {
                animation: menu-item-icon-zoom 0.03s linear forwards;
            }
            @keyframes menu-item-icon-zoom {
                0% { scale: 100%; }
                100% { scale: 102%; }
            }
            .menu-item-name {
                padding: 12px;
            }
            .bottombar {
                flex-shrink: 0;
                padding: 16px;
                text-align: right;
                background: linear-gradient(0deg, var(--home-vig), transparent);
            }
            a {
                text-decoration: none;
            }
            a div.menu-item-name {
                color: var(--home-fg);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="topbar">
                <span>시</span><span>누</span><span>의</span>&nbsp;<span>장</span><span>난</span><span>감</span>&nbsp;<span>상</span><span>자</span>
            </div>
            <div class="menu">
                <a href="dailycalc/">
                    <div class="menu-item-container">
                        <img class="menu-item-icon" src="icons/dailycalc.png">
                        <div class="menu-item-name">매일매일 계산</div>
                    </div>
                </a>
                <a href="blackjack/">
                    <div class="menu-item-container">
                        <img class="menu-item-icon" src="icons/blackjack.png">
                        <div class="menu-item-name">블랙잭</div>
                    </div>
                </a>
            </div>
            <div class="bottombar">
                © 2025 sinu. All rights reserved.
            </div>
        </div>
        <script>
            let mics = document.querySelectorAll(".menu-item-container");
            mics.forEach(mic => {
                const tiltLeft = Math.random() > 0.5;
                mic.style.setProperty("--tilt", tiltLeft ? "3deg" : "-3deg");
            });
        </script>
    </body>
</html>
